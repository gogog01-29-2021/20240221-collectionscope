name: Deploy Family Album 3D Beta

on:
  push:
    branches:
      - family-album-3d-beta
    paths:
      - "family-album-3d-beta/**"
      - ".github/workflows/deploy-family-album-beta.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: family-album-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static beta
        uses: actions/upload-pages-artifact@v4
        with:
          path: family-album-3d-beta

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
